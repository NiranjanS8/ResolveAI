# Postgres only. Ticket processing is queued in the ticket_jobs table and drained
# by the worker inside the app, so there is no broker to run alongside it.
version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolveai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveai}
      POSTGRES_DB: ${POSTGRES_DB:-resolveai}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolveai} -d ${POSTGRES_DB:-resolveai}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
